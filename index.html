
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maryam & Ridwan</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body {
  background: #101b35;
  color: #f5ead6;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 15px;
  margin: 0;
}
#reader {
  width: 100%;
  max-width: 400px;
  margin: 15px auto;
  border-radius: 15px;
  overflow: hidden;
}
button, input {
  padding: 15px;
  font-size: 18px;
  border-radius: 10px;
  border: none;
  margin: 8px;
}
button {
  background: #f5ead6;
  color: #101b35;
}
#result {
  font-size: 20px;
  font-weight: bold;
  padding: 10px;
}
#resultImage {
  display: none;
  width: 100%;
  max-width: 450px;
  max-height: 72vh;
  object-fit: contain;
  margin: 0 auto;
  border-radius: 12px;
}
</style>
</head>

<body>

<div id="heading">
<h1>مريم ورضوان</h1>
<p>30.12.2026</p>
<h2>نظام دخول المدعوات</h2>
</div>

<div id="login">
  <input id="pin" type="password"
    inputmode="numeric"
    placeholder="رمز المشرفة">
  <button onclick="login()">دخول</button>
</div>

<div id="panel" style="display:none">
  <div id="reader"></div>
  <img id="resultImage" alt="">
  <div id="result"></div>
  <button id="start" onclick="startScanner()">
    مسح الدعوة
  </button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwM3eijqxhHEhd5RE6uELW-Q0ry54GEjUGIk7fw26LgMiTgA-i13W89t_DqIXkx_ik/exec";

const successImage = new Image();
successImage.src = "success.png";

const rejectedImage = new Image();
rejectedImage.src = "rejected.png";

let pin = "";
let scanner;
let busy = false;

function login() {
  pin = document.getElementById("pin").value;
  if (!pin) return;
  document.getElementById("login").style.display = "none";
  document.getElementById("panel").style.display = "block";
}

function showResult(message, color) {
  const result = document.getElementById("result");
  result.textContent = message;
  result.style.color = color;
}

function showImage(success, message) {
  const img = document.getElementById("resultImage");

  document.getElementById("heading").style.display = "none";
  document.getElementById("reader").style.display = "none";

  img.src = success ? "success.png" : "rejected.png";
  img.alt = message;
  img.style.display = "block";

  img.onerror = function() {
    img.style.display = "none";
  };

  showResult(message, success ? "#8ee5a1" : "#ff9999");
}

async function startScanner() {
  busy = false;

  document.getElementById("resultImage").style.display = "none";
  document.getElementById("heading").style.display = "block";
  document.getElementById("reader").style.display = "block";
  document.getElementById("start").disabled = true;

  showResult("وجهي الكاميرا نحو الباركود", "#f5ead6");

  try {
    scanner = new Html5Qrcode("reader");

    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 230 },
      async function(decodedText) {
        if (busy) return;
        busy = true;

        try {
          await scanner.stop();
          scanner.clear();
          await verifyTicket(decodedText);
        } catch (error) {
          showResult("تعذر إكمال المسح", "#ffcc66");
        } finally {
          document.getElementById("start").disabled = false;
          document.getElementById("start").textContent =
            "مسح الدعوة التالية";
        }
      },
      function() {}
    );
  } catch(error) {
    showResult(String(error), "#ff9999");
    document.getElementById("start").disabled = false;
  }
}

async function verifyTicket(text) {
  let token = "";

  try {
    const url = new URL(text);
    if (url.origin + url.pathname === API) {
      token = url.searchParams.get("token") || "";
    }
  } catch(error) {}

  if (!/^[a-f0-9-]{36}$/i.test(token)) {
    showImage(false, "عذراً، الدعوة غير صالحة");
    return;
  }

  showResult("جاري التحقق من الدعوة...", "#f5ead6");

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },
      body: JSON.stringify({
        token: token,
        pin: pin
      })
    });

    const data = await response.json();

    if (data.ok === true) {
      showImage(true, "تم تأكيد الحضور بنجاح");

    } else if (data.code === "PIN") {
      alert("رمز المشرفة غير صحيح");
      document.getElementById("login").style.display = "block";
      document.getElementById("panel").style.display = "none";
      document.getElementById("pin").value = "";
      pin = "";

    } else if (data.message === "تعذر التحقق من الدعوة") {
      showResult(
        "تعذر التحقق من نتيجة الدخول، راجعي سجل الحضور",
        "#ffcc66"
      );

    } else {
      showImage(false, data.message || "الدعوة غير صالحة");
    }

  } catch(error) {
    showResult(
      "تعذر التحقق من نتيجة الدخول، راجعي سجل الحضور",
      "#ffcc66"
    );
  }
}
</script>

</body>
</html>
